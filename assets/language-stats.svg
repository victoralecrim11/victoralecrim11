    <rect x="42.00" y="118" width="584.36" height="18" fill="#3572A5" />
    <rect x="626.36" y="118" width="17.82" height="18" fill="#F1E05A" />
    <rect x="644.18" y="118" width="16.65" height="18" fill="#E34C26" />
    <rect x="660.83" y="118" width="15.00" height="18" fill="#178600" />
    <rect x="675.83" y="118" width="14.91" height="18" fill="#4F5D95" />
